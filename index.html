<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumbotron SMKN 2 Bangkalan</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <!-- Header -->
    <header>
      <!-- Jumbotron -->
      <div class="relative w-full">
        <img src="assets/halaman depan.jpg" alt="SMKN 2 Bangkalan" class="w-full h-96 sm:h-[60vh] object-cover" />
        <div class="absolute inset-0 bg-black bg-opacity-10 flex justify-center items-center"></div>
      </div>

      <!-- Navbar -->
      <nav class="bg-white shadow-md py-3 w-full">
        <div class="max-w-6xl mx-auto flex justify-between items-center px-6">
          <!-- Logo & Nama Sekolah -->
          <div class="flex items-center space-x-3">
            <img src="assets/Logo Smk 2.jpg" alt="Logo SMKN 2 Bangkalan" class="w-10 h-10 sm:w-12 sm:h-12 object-cover" />
            <span class="text-xl font-bold text-gray-800">SMKN 2 Bangkalan</span>
          </div>

          <!-- Menu Hamburger -->
          <button id="menu-toggle" class="sm:hidden text-gray-800 focus:outline-none" aria-label="Toggle Menu">☰</button>

          <!-- Menu Navigasi -->
          <ul id="menu" class="hidden sm:flex space-x-4">
            <li><a href="index.html" class="px-4 py-2 bg-red-600 text-white rounded-full shadow-sm hover:bg-red-700">Beranda</a></li>
            <li><a href="pages/profile.html" class="px-4 py-2 bg-red-600 text-white rounded-full shadow-sm hover:bg-red-700">Profile</a></li>
            <li><a href="pages/prestasi.html" class="px-4 py-2 bg-red-600 text-white rounded-full shadow-sm hover:bg-red-700">Prestasi</a></li>
            <li><a href="pages/fasilitas.html" class="px-4 py-2 bg-red-600 text-white rounded-full shadow-sm hover:bg-red-700">Fasilitas</a></li>
            <li><a href="pages/jurusan.html" class="px-4 py-2 bg-red-600 text-white rounded-full shadow-sm hover:bg-red-700">Jurusan</a></li>
          </ul>
        </div>

        <!-- Menu Navigasi untuk Mobile -->
        <ul id="mobile-menu" class="hidden sm:hidden flex flex-col space-y-2 mt-2 px-6">
          <li><a href="index.html" class="block px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 w-full">Beranda</a></li>
          <li><a href="pages/profile.html" class="block px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">Profile</a></li>
          <li><a href="pages/prestasi" class="block px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">Prestasi</a></li>
          <li><a href="pages/fasilitas" class="block px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">Fasilitas</a></li>
          <li><a href="pages/jurusan" class="block px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">Jurusan</a></li>
        </ul>
      </nav>
    </header>

    <!-- Script untuk Toggle Menu -->
    <script>
      document.getElementById("menu-toggle").addEventListener("click", function () {
        document.getElementById("mobile-menu").classList.toggle("hidden");
      });
    </script>
  </body>
</html>
